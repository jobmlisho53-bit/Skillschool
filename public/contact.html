<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Income School - Get Support or Ask Questions</title>
    <meta name="description" content="Contact Income School for support, course suggestions, or business inquiries. We respond within 48 hours.">
    <meta name="keywords" content="contact income school, support, help, course suggestions">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://skillschool-dbc1.vercel.app/contact">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8038320098546953" crossorigin="anonymous"></script>
    
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #667eea; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 30px; color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or suggestions? We'd love to hear from you.</p>
    
    <form id="contactForm">
        <label>Your Name *</label>
        <input type="text" id="name" required>
        
        <label>Your Email *</label>
        <input type="email" id="email" required>
        
        <label>Subject *</label>
        <select id="subject" required>
            <option value="">Select a subject</option>
            <option value="Course Suggestion">Course Suggestion</option>
            <option value="Technical Issue">Technical Issue</option>
            <option value="Business Inquiry">Business Inquiry</option>
            <option value="Other">Other</option>
        </select>
        
        <label>Message *</label>
        <textarea id="message" rows="6" required></textarea>
        
        <button type="submit">Send Message</button>
    </form>
    
    <div id="successMessage" style="display:none; color: green; margin-top: 20px;">✓ Message sent! We'll respond within 48 hours.</div>
    <div id="errorMessage" style="display:none; color: red; margin-top: 20px;">✗ Error sending message. Please try again or email directly.</div>
    
    <p style="margin-top: 30px;">Or email us directly: <strong>jobmlisho63@gmail.com</strong></p>
    
    <a href="/" class="back-link">← Back to Home</a>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };
            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (res.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('contactForm').reset();
                    setTimeout(() => document.getElementById('successMessage').style.display = 'none', 5000);
                } else throw new Error();
            } catch(e) {
                document.getElementById('errorMessage').style.display = 'block';
                setTimeout(() => document.getElementById('errorMessage').style.display = 'none', 5000);
            }
        });
    </script>
</body>
</html>
