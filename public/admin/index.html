<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Income School</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf9f7; color: #1a1a1a; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .header { background: #ffffff; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding: 24px 0; }
        .nav { background: white; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding: 12px 0; }
        .nav button { background: none; border: 1px solid rgba(212, 175, 55, 0.3); padding: 8px 20px; margin: 0 8px; border-radius: 4px; cursor: pointer; color: #1a1a1a; }
        .nav button:hover { border-color: #c9a03d; color: #c9a03d; }
        .section { background: white; border-radius: 8px; padding: 24px; margin: 24px 0; border: 1px solid rgba(212, 175, 55, 0.15); }
        .hidden { display: none; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; font-family: inherit; }
        button[type="submit"] { background: #c9a03d; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; }
        .module-card { border: 1px solid rgba(212, 175, 55, 0.15); padding: 16px; margin: 16px 0; border-radius: 6px; }
        .lesson-item { border-left: 2px solid #c9a03d; padding: 8px 12px; margin: 8px 0; background: #fefcf8; }
    </style>
</head>
<body>
    <div class="header"><div class="container"><h1>Admin Dashboard</h1></div></div>
    <div class="nav"><div class="container"><button onclick="showSection('create')">Create Module</button><button onclick="showSection('upload')">Add Content</button><button onclick="showSection('modules')">View Modules</button></div></div>
    <div class="container">
        <div id="createSection" class="section"><h2>Create Module</h2><form id="moduleForm"><input type="text" name="moduleId" placeholder="Module ID" required><input type="text" name="title" placeholder="Title" required><textarea name="description" placeholder="Description"></textarea><input type="text" name="estimatedTime" placeholder="Duration"><button type="submit">Create</button></form><div id="createMsg"></div></div>
        <div id="uploadSection" class="section hidden"><h2>Add Lesson</h2><form id="uploadForm"><select id="moduleSelect" required><option>Loading...</option></select><input type="text" id="lessonTitle" placeholder="Lesson Title" required><input type="url" id="youtubeUrl" placeholder="YouTube URL" required><input type="text" id="duration" placeholder="Duration"><input type="number" id="order" placeholder="Order" value="1"><button type="submit">Add</button></form><div id="uploadMsg"></div></div>
        <div id="modulesSection" class="section hidden"><h2>All Modules</h2><div id="modulesList"></div></div>
    </div>
    <script>
        async function showSection(s) {
            document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
            document.getElementById(s + 'Section').classList.remove('hidden');
            if (s === 'upload') await loadModules();
            if (s === 'modules') await loadModulesList();
        }
        async function loadModules() {
            const res = await fetch('/api/modules');
            const modules = await res.json();
            const sel = document.getElementById('moduleSelect');
            sel.innerHTML = '<option value="">Select</option>';
            modules.forEach(m => { const opt = document.createElement('option'); opt.value = m.module_id; opt.textContent = m.title; sel.appendChild(opt); });
        }
        async function loadModulesList() {
            const res = await fetch('/api/modules');
            const modules = await res.json();
            const container = document.getElementById('modulesList');
            container.innerHTML = '';
            for (const m of modules) {
                const lessons = await (await fetch(`/api/modules/${m.module_id}/lessons`)).json();
                container.innerHTML += `<div class="module-card"><h3>${m.title}</h3><p>${m.description || ''}</p><div>${lessons.map(l => `<div class="lesson-item">${l.order || 1}. ${l.title}<br><small>${l.duration || 'N/A'}</small></div>`).join('') || 'No lessons'}</div></div>`;
            }
        }
        document.getElementById('moduleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            const res = await fetch('/api/admin/modules', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) { alert('Created'); e.target.reset(); loadModulesList(); } else alert('Error');
        });
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { moduleId: document.getElementById('moduleSelect').value, lessonTitle: document.getElementById('lessonTitle').value, youtubeUrl: document.getElementById('youtubeUrl').value, duration: document.getElementById('duration').value, order: document.getElementById('order').value };
            const res = await fetch('/api/admin/youtube-lesson', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) { alert('Added'); e.target.reset(); loadModulesList(); } else alert('Error');
        });
        showSection('create');
    </script>
</body>
</html>
