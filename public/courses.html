<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Income School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        
        .header { background: #ffffff; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .logo h1 { font-size: 1.5rem; font-weight: 600; color: #1a1a1a; }
        .logo p { font-size: 0.7rem; color: #c9a03d; letter-spacing: 1px; }
        
        #auth-container { display: flex; align-items: center; gap: 16px; }
        #user-info { display: flex; align-items: center; gap: 12px; }
        #user-avatar { width: 32px; height: 32px; border-radius: 50%; }
        #login-btn { background: #c9a03d; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        #logout-btn { background: none; border: 1px solid #c9a03d; color: #c9a03d; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .theme-toggle { background: none; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 40px; padding: 6px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 48px 0; }
        .course-card { background: white; border-radius: 8px; padding: 24px; border: 1px solid rgba(212, 175, 55, 0.15); cursor: pointer; transition: all 0.2s; }
        .course-card:hover { transform: translateY(-2px); border-color: rgba(212, 175, 55, 0.4); }
        .course-category { font-size: 0.7rem; text-transform: uppercase; color: #c9a03d; margin-bottom: 12px; letter-spacing: 1px; }
        .course-card h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .course-card p { font-size: 0.85rem; color: #6b6b6b; margin-bottom: 16px; }
        .progress-bar { background: #f0ede8; border-radius: 2px; height: 2px; margin: 16px 0 8px; }
        .progress-fill { background: #c9a03d; height: 100%; border-radius: 2px; width: 0%; }
        .progress-text { font-size: 0.7rem; color: #c9a03d; text-align: right; }
        .course-meta { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(212, 175, 55, 0.1); }
        .course-duration { font-size: 0.7rem; color: #9a9a9a; }
        .start-link { font-size: 0.8rem; color: #c9a03d; text-decoration: none; }
        
        .lesson-item { background: white; padding: 16px; margin: 12px 0; border-radius: 6px; border: 1px solid rgba(212, 175, 55, 0.15); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .lesson-item:hover { border-color: rgba(212, 175, 55, 0.4); }
        .lesson-completed { border-left: 2px solid #c9a03d; background: #fefcf8; }
        .complete-badge { background: #c9a03d; color: white; padding: 2px 8px; border-radius: 2px; font-size: 0.6rem; }
        
        .back-button { background: none; border: none; color: #c9a03d; cursor: pointer; padding: 12px 0; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .mark-complete-btn { background: #c9a03d; color: white; border: none; padding: 12px 28px; border-radius: 4px; cursor: pointer; margin-top: 24px; font-weight: 500; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; margin: 24px 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 6px; }
        
        .footer { background: #ffffff; border-top: 1px solid rgba(212, 175, 55, 0.15); padding: 32px 0; text-align: center; margin-top: 60px; }
        .footer a { color: #6b6b6b; text-decoration: none; margin: 0 12px; font-size: 0.8rem; }
        .footer a:hover { color: #c9a03d; }
        .hidden { display: none; }
        .loading { text-align: center; padding: 60px; color: #c9a03d; }
        
        @media (max-width: 768px) {
            .courses-grid { grid-template-columns: 1fr; }
            .lesson-item { flex-direction: column; text-align: center; gap: 8px; }
            .header-content { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo"><h1>Income School</h1><p>Professional Skills Mastery</p></div>
                <div id="auth-container">
                    <div id="user-info" style="display: none;">
                        <img id="user-avatar" style="width: 32px; height: 32px; border-radius: 50%;">
                        <span id="user-name"></span>
                        <button id="logout-btn">Logout</button>
                    </div>
                    <button id="login-btn">Sign in with Google</button>
                </div>
                <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
            </div>
        </div>
    </div>

    <main class="container">
        <section id="courses-section">
            <div id="courses-container" class="courses-grid"><div class="loading">Loading courses...</div></div>
        </section>
        
        <section id="lessons-section" class="hidden">
            <button id="back-to-courses" class="back-button">← Back to Courses</button>
            <h2 id="course-title"></h2>
            <div id="course-description"></div>
            <div id="progress-container" class="progress-section" style="display: none;">
                <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
                <div id="progress-text" class="progress-text"></div>
            </div>
            <div id="lessons-list"></div>
        </section>
        
        <section id="player-section" class="hidden">
            <button id="back-to-lessons" class="back-button">← Back to Lessons</button>
            <h2 id="lesson-title"></h2>
            <div id="lesson-player"></div>
            <button id="mark-complete-btn" class="mark-complete-btn">Mark as Complete</button>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <a href="/privacy">Privacy</a> | <a href="/terms">Terms</a> | <a href="/contact">Contact</a>
            <div style="margin-top: 16px;">© 2026 Income School. All rights reserved.</div>
        </div>
    </footer>

    <script>
        // Theme Management
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').textContent = '☀️ Light Mode';
            }
            document.getElementById('themeToggle').addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                if (current === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    document.getElementById('themeToggle').textContent = '🌙 Dark Mode';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    document.getElementById('themeToggle').textContent = '☀️ Light Mode';
                }
            });
        })();
        
        let currentCourse = null, currentLesson = null, userId = null;
        let youtubePlayer = null, watchInterval = null, watchedSeconds = 0, totalDuration = 0, watchPercentage = 0;
        
        function getUserId() {
            let id = localStorage.getItem('user_id');
            if (!id) id = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            return id;
        }
        userId = getUserId();
        
        async function loadCourses() {
            try {
                const res = await fetch('/api/modules');
                const courses = await res.json();
                const container = document.getElementById('courses-container');
                if (courses.length === 0) { container.innerHTML = '<div class="loading">No courses yet</div>'; return; }
                container.innerHTML = '';
                for (const course of courses) {
                    const progress = await (await fetch(`/api/progress/${userId}/${course.module_id}`)).json();
                    const card = document.createElement('div');
                    card.className = 'course-card';
                    card.onclick = () => showCourse(course);
                    card.innerHTML = `<div class="course-category">${course.category || 'Course'}</div><h3>${course.title}</h3><p>${course.description || ''}</p><div class="progress-bar"><div class="progress-fill" style="width: ${progress.percentage}%"></div></div><div class="progress-text">${progress.completed}/${progress.total} lessons</div><div class="course-meta"><span class="course-duration">${course.estimated_time || 'Self-paced'}</span><span class="start-link">Continue →</span></div>`;
                    container.appendChild(card);
                }
            } catch(e) { console.error(e); }
        }
        
        async function showCourse(course) {
            currentCourse = course;
            document.getElementById('course-title').textContent = course.title;
            document.getElementById('course-description').innerHTML = `<p>${course.description || ''}</p><p>Estimated: ${course.estimated_time || 'Self-paced'}</p>`;
            const lessons = await (await fetch(`/api/modules/${course.module_id}/lessons`)).json();
            const progress = await (await fetch(`/api/progress/${userId}/${course.module_id}`)).json();
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
            document.getElementById('progress-text').textContent = `${progress.completed}/${progress.total} lessons completed`;
            const list = document.getElementById('lessons-list');
            list.innerHTML = '';
            lessons.forEach(lesson => {
                const completed = progress.completedLessons?.includes(lesson.id);
                const div = document.createElement('div');
                div.className = `lesson-item ${completed ? 'lesson-completed' : ''}`;
                div.innerHTML = `<div><strong>${lesson.order || 1}. ${lesson.title}</strong><br><small>${lesson.duration || 'N/A'}</small></div>${completed ? '<span class="complete-badge">✓</span>' : ''}`;
                div.onclick = () => playLesson(lesson);
                list.appendChild(div);
            });
            document.getElementById('courses-section').classList.add('hidden');
            document.getElementById('lessons-section').classList.remove('hidden');
            document.getElementById('player-section').classList.add('hidden');
        }
        
        function playLesson(lesson) {
            currentLesson = lesson;
            document.getElementById('lesson-title').textContent = lesson.title;
            document.getElementById('lesson-player').innerHTML = `<div id="youtube-player" style="width:100%;aspect-ratio:16/9;"></div>`;
            if (typeof YT === 'undefined') {
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => createPlayer(lesson);
            } else { createPlayer(lesson); }
            document.getElementById('courses-section').classList.add('hidden');
            document.getElementById('lessons-section').classList.add('hidden');
            document.getElementById('player-section').classList.remove('hidden');
        }
        
        function createPlayer(lesson) {
            youtubePlayer = new YT.Player('youtube-player', {
                height: '100%', width: '100%', videoId: lesson.youtube_id,
                events: {
                    'onReady': (e) => { totalDuration = e.target.getDuration(); },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            watchInterval = setInterval(() => {
                                const ct = youtubePlayer.getCurrentTime();
                                watchPercentage = (ct / totalDuration) * 100;
                                if (watchPercentage >= 90) document.getElementById('mark-complete-btn').disabled = false;
                            }, 2000);
                        } else if (e.data === YT.PlayerState.PAUSED) { clearInterval(watchInterval); }
                    }
                }
            });
        }
        
        document.getElementById('mark-complete-btn')?.addEventListener('click', async () => {
            if (!currentLesson) return;
            await fetch('/api/progress/mark-complete', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, lessonId: currentLesson.id, moduleId: currentCourse.module_id })
            });
            alert('Lesson completed!');
            showCourse(currentCourse);
        });
        
        document.getElementById('back-to-courses')?.addEventListener('click', () => {
            document.getElementById('courses-section').classList.remove('hidden');
            document.getElementById('lessons-section').classList.add('hidden');
            document.getElementById('player-section').classList.add('hidden');
            loadCourses();
        });
        document.getElementById('back-to-lessons')?.addEventListener('click', () => { if (currentCourse) showCourse(currentCourse); });
        
        loadCourses();
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/js/supabase-auth.js"></script>
</body>
</html>
