<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Certificate - Income School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Certificate Preview */
        .cert-preview { background: white; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 20px; }
        .cert-icon { font-size: 60px; margin-bottom: 16px; }
        .cert-preview h2 { font-size: 1.8rem; margin-bottom: 8px; }
        .cert-sample { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #e0e0e0; }
        
        /* Tier Cards */
        .tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
        .tier-card { background: white; border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; border: 2px solid #e0e0e0; }
        .tier-card:hover { transform: translateY(-4px); }
        .tier-card.selected { border-color: #667eea; background: #f0f4ff; }
        .tier-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .tier-price { font-size: 1.8rem; font-weight: 800; color: #667eea; margin: 16px 0; }
        .tier-features { list-style: none; text-align: left; margin: 20px 0; }
        .tier-features li { padding: 6px 0; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .feature-check { color: #48bb78; font-weight: bold; }
        
        .btn { background: #667eea; color: white; border: none; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 16px; }
        .btn:hover { background: #5a67d8; transform: translateY(-2px); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: white; text-decoration: none; }
        
        @media (max-width: 768px) { .tier-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="cert-preview">
            <div class="cert-icon">🏆</div>
            <h2>You've Earned a Certificate!</h2>
            <p>Congratulations on completing the course</p>
            <div class="cert-sample">
                <div class="cert-sample-title">CERTIFICATE OF COMPLETION</div>
                <div style="font-size: 18px; font-weight: 600; margin: 10px 0;">[Your Name]</div>
                <div style="font-size: 12px; color: #666;">Course Name</div>
            </div>
        </div>
        
        <h3 style="color: white; text-align: center; margin-bottom: 16px;">Choose Your Certificate Tier</h3>
        
        <div id="tiers-container" class="tier-grid">
            <div class="loading">Loading options...</div>
        </div>
        
        <a href="/courses" class="back-link">← Back to Courses</a>
    </div>
    
    <script>
        let selectedTier = null;
        let moduleId = null;
        let courseName = null;
        
        const urlParams = new URLSearchParams(window.location.search);
        moduleId = urlParams.get('cert');
        courseName = urlParams.get('course') || 'Course';
        
        async function loadTiers() {
            const res = await fetch('/api/certificate/tiers');
            const tiers = await res.json();
            const container = document.getElementById('tiers-container');
            
            container.innerHTML = tiers.map(tier => `
                <div class="tier-card" onclick="selectTier('${tier.tier_name}', ${tier.price})">
                    <div class="tier-name">${tier.tier_name === 'free' ? '🎓 Free' : tier.tier_name === 'verified' ? '✅ Verified' : '💼 Career'}</div>
                    <div class="tier-price">${tier.price === 0 ? 'FREE' : `$${(tier.price / 100).toFixed(2)}`}</div>
                    <ul class="tier-features">
                        <li>${tier.includes_pdf ? '✓' : '✗'} Downloadable PDF</li>
                        <li>${tier.includes_qr ? '✓' : '✗'} QR Code for verification</li>
                        <li>${tier.includes_verification_link ? '✓' : '✗'} Public verification link</li>
                        <li>${tier.includes_linkedin_share ? '✓' : '✗'} LinkedIn sharing</li>
                        <li>${tier.includes_portfolio_badge ? '✓' : '✗'} Portfolio badge</li>
                        <li>${tier.includes_skills_assessment ? '✓' : '✗'} Skills assessment</li>
                    </ul>
                </div>
            `).join('');
        }
        
        function selectTier(tier, price) {
            selectedTier = tier;
            document.querySelectorAll('.tier-card').forEach(card => card.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            
            // Show proceed button if not already there
            let btn = document.getElementById('proceedBtn');
            if (!btn) {
                btn = document.createElement('button');
                btn.id = 'proceedBtn';
                btn.className = 'btn';
                btn.textContent = price === 0 ? 'Claim Free Certificate →' : `Pay $${(price/100).toFixed(2)} & Claim →`;
                btn.onclick = claimCertificate;
                document.querySelector('.container').appendChild(btn);
            } else {
                btn.textContent = price === 0 ? 'Claim Free Certificate →' : `Pay $${(price/100).toFixed(2)} & Claim →`;
            }
        }
        
        async function claimCertificate() {
            const name = prompt('Enter your name for the certificate:', 'Student');
            if (!name) return;
            
            const res = await fetch('/api/certificate/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: localStorage.getItem('user_id') || 'user_' + Date.now(),
                    moduleId: moduleId,
                    name: name,
                    tier: selectedTier
                })
            });
            const data = await res.json();
            
            if (data.requiresPayment) {
                window.location.href = data.paymentUrl;
            } else if (data.success) {
                alert(`Certificate generated! ${data.tier.toUpperCase()} tier`);
                window.location.href = data.downloadUrl;
            } else {
                alert('Error: ' + data.error);
            }
        }
        
        loadTiers();
    </script>
</body>
</html>
