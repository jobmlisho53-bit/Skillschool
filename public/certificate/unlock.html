<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Certificate - Income School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; }
        
        /* Certificate Preview Card */
        .cert-preview { background: white; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .cert-icon { font-size: 60px; margin-bottom: 16px; }
        .cert-preview h2 { font-size: 1.5rem; color: #1a1a1a; margin-bottom: 8px; }
        .cert-preview p { color: #666; font-size: 0.85rem; }
        .cert-sample { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #e0e0e0; }
        .cert-sample-title { font-size: 12px; color: #c9a03d; letter-spacing: 2px; margin-bottom: 8px; }
        .cert-sample-name { font-size: 18px; font-weight: 600; font-family: 'Cormorant Garamond', serif; margin: 10px 0; }
        
        /* Value Proposition */
        .value-prop { background: white; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
        .value-prop h3 { font-size: 1.2rem; margin-bottom: 16px; color: #1a1a1a; }
        .value-item { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .value-icon { font-size: 24px; }
        .value-text { font-size: 0.9rem; color: #444; }
        
        /* Support Message */
        .support-message { background: #fff8e7; border-radius: 20px; padding: 24px; text-align: center; border: 1px solid #f5e6b8; margin-bottom: 20px; }
        .support-message p { color: #856404; font-size: 0.9rem; margin-bottom: 8px; }
        .support-message strong { color: #c9a03d; }
        
        /* Price Card */
        .price-card { background: white; border-radius: 20px; padding: 24px; text-align: center; margin-bottom: 20px; border: 2px solid #c9a03d; }
        .price { font-size: 2.5rem; font-weight: 700; color: #667eea; }
        .price small { font-size: 0.8rem; color: #666; }
        .btn-pay { background: #48bb78; color: white; border: none; padding: 16px 32px; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; transition: transform 0.2s; }
        .btn-pay:hover { transform: translateY(-2px); background: #38a169; }
        .btn-skip { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; margin-top: 16px; text-decoration: underline; }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; color: white; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">Loading certificate preview...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accessCode = urlParams.get('code');
        const certId = urlParams.get('cert');
        
        async function loadCertificate() {
            // Verify code and get certificate details
            const verifyRes = await fetch('/api/verify-certificate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessCode: accessCode })
            });
            const verifyData = await verifyRes.json();
            
            if (!verifyData.valid) {
                document.getElementById('app').innerHTML = `
                    <div class="cert-preview" style="background: white;">
                        <h2>❌ Invalid Access Code</h2>
                        <p>Please check your code or contact support.</p>
                        <a href="/" style="color: #667eea;">Back to Home</a>
                    </div>
                `;
                return;
            }
            
            // Get course details
            const courseRes = await fetch(`/api/modules/${certId}`);
            const course = await courseRes.json();
            
            document.getElementById('app').innerHTML = `
                <!-- Certificate Preview -->
                <div class="cert-preview">
                    <div class="cert-icon">🏆</div>
                    <h2>You've Earned a Certificate!</h2>
                    <p>Congratulations on completing ${course.title}</p>
                    
                    <div class="cert-sample">
                        <div class="cert-sample-title">CERTIFICATE OF COMPLETION</div>
                        <div class="cert-sample-name">[Your Name]</div>
                        <div style="font-size: 11px; color: #999;">${course.title}</div>
                        <div style="margin-top: 12px;"><span style="background: #c9a03d; padding: 4px 12px; border-radius: 20px; font-size: 10px; color: white;">⭐ Verified</span></div>
                    </div>
                </div>
                
                <!-- Value Proposition -->
                <div class="value-prop">
                    <h3>✨ Your Certificate Includes</h3>
                    <div class="value-item"><div class="value-icon">📄</div><div class="value-text">High-quality PDF certificate with unique ID</div></div>
                    <div class="value-item"><div class="value-icon">🔗</div><div class="value-text">Shareable verification link for employers</div></div>
                    <div class="value-item"><div class="value-icon">📧</div><div class="value-text">Email delivery + lifetime access</div></div>
                    <div class="value-item"><div class="value-icon">🏷️</div><div class="value-text">Your name, course name, completion date</div></div>
                </div>
                
                <!-- Support Message -->
                <div class="support-message">
                    <p>❤️ <strong>This platform is 100% free</strong> because of supporters like you.</p>
                    <p>Your purchase helps us keep courses free for everyone in Africa.</p>
                    <p style="font-size: 0.8rem;">Server costs • Development • Free education for all</p>
                </div>
                
                <!-- Price -->
                <div class="price-card">
                    <div class="price">$4.99 <small>USD</small></div>
                    <p style="color: #666; font-size: 0.8rem; margin-top: 8px;">One-time payment • Lifetime access</p>
                    <button class="btn-pay" onclick="proceedToPayment()">💳 Support & Get Certificate →</button>
                    <button class="btn-skip" onclick="skipForNow()">Maybe later, I'll just screenshot</button>
                </div>
            `;
        }
        
        async function proceedToPayment() {
            const email = prompt('Enter your email to receive the certificate:', '');
            if (!email) return;
            
            const btn = document.querySelector('.btn-pay');
            btn.disabled = true;
            btn.textContent = 'Redirecting to payment...';
            
            const courseRes = await fetch(`/api/modules/${certId}`);
            const course = await courseRes.json();
            
            const response = await fetch('/api/pay/certificate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    certificateId: certId,
                    userName: 'Student',
                    courseName: course.title
                })
            });
            const data = await response.json();
            if (data.authorization_url) {
                window.location.href = data.authorization_url;
            }
        }
        
        function skipForNow() {
            if (confirm('You can still screenshot this page as proof. Want to support us later?\n\nYour certificate will be waiting when you return.')) {
                window.location.href = '/';
            }
        }
        
        loadCertificate();
    </script>
</body>
</html>
