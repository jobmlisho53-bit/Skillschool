<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Certificate - Income School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; }
        .cert-card { background: white; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .cert-icon { font-size: 60px; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; margin-bottom: 10px; }
        .cert-code { background: #f0f4ff; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 18px; margin: 20px 0; }
        .btn { display: inline-block; background: #667eea; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; margin: 10px; }
        .btn-green { background: #48bb78; }
        .coming-soon { background: #fff3cd; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 12px; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cert-card">
            <div class="cert-icon">🎓</div>
            <h2>Congratulations!</h2>
            <p>You've earned a certificate for completing this course.</p>
            
            <div class="cert-code">
                Certificate ID: <strong id="certId">Loading...</strong>
            </div>
            
            <div>
                <button onclick="downloadCertificate()" class="btn btn-green">📥 Download PDF</button>
                <a href="/" class="btn">← Back to Home</a>
            </div>
            
            <div class="coming-soon">
                💡 Coming soon: Share to LinkedIn • Verify online • Printed certificates
            </div>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certId = urlParams.get('cert');
        document.getElementById('certId').textContent = certId || 'CERT-' + Date.now();
        
        function downloadCertificate() {
            alert('Certificate download will be available soon! Your certificate ID is: ' + document.getElementById('certId').textContent);
        }
    </script>
</body>
</html>
